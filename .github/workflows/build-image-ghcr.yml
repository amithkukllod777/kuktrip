name: Build image → GHCR (trip.kuklabs.com)

# Build the Kuk Trip Docker image on GitHub's runners and push it to GHCR, so the
# small production EC2 (≈1 GB RAM, shared with KukBook) NEVER builds locally — it
# only `docker pull`s a ready image. Building on the box previously exhausted its
# RAM/disk and froze the shared host. See deploy/DEPLOY_AWS.md.
#
# After a run: on the box →
#   cd /opt/kuktrip && docker compose -f docker-compose.prod.yml pull && \
#     docker compose -f docker-compose.prod.yml up -d && docker image prune -f

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-image-ghcr.yml'
  workflow_dispatch:

concurrency:
  group: ghcr-build
  cancel-in-progress: false

jobs:
  build-and-push:
    # Fork only — the upstream repo publishes to Docker Hub via docker.yml.
    if: github.repository == 'amithkukllod777/kuktrip'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:prod
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed to GHCR :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}:prod" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "On the EC2: \`cd /opt/kuktrip && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d && docker image prune -f\`" >> "$GITHUB_STEP_SUMMARY"
